<div class="ibox float-e-margins">
    <div class="ibox-title">
        <h5 langtag="word-serverlog"></h5>
        <div class="ibox-tools">
            <div class="btn-group">
                <button class="btn btn-xs btn-default" type="button" id="logRefresh">
                    <i class="fa fa-refresh"></i> <span langtag="word-refresh"></span>
                </button>
                <button class="btn btn-xs btn-default" type="button" id="logToggle">
                    <i class="fa fa-pause"></i> <span id="logToggleText" langtag="word-logpause"></span>
                </button>
                <button class="btn btn-xs btn-default" type="button" id="logDownload">
                    <i class="fa fa-download"></i> <span langtag="word-download"></span>
                </button>
                <button class="btn btn-xs btn-danger" type="button" id="logClear">
                    <i class="fa fa-trash"></i> <span langtag="word-logclear"></span>
                </button>
            </div>
        </div>
    </div>
    <div class="ibox-content">
        <div class="row" style="margin-bottom: 10px;">
            <div class="col-sm-4">
                <input type="text" class="form-control" id="logKeyword"
                       placeholder="" langtag="info-logkeywordtips">
            </div>
            <div class="col-sm-3">
                <select class="form-control" id="logLevel">
                    <option value="" langtag="word-loglevelall"></option>
                    <option value="error" langtag="word-loglevelerror"></option>
                    <option value="warning" langtag="word-loglevelwarning"></option>
                    <option value="notice" langtag="word-loglevelnotice"></option>
                    <option value="info" langtag="word-loglevelinfo"></option>
                    <option value="debug" langtag="word-logleveldebug"></option>
                </select>
            </div>
            <div class="col-sm-5" style="line-height: 34px;">
                <span class="text-muted" id="logStat"></span>
            </div>
        </div>

        <div id="logFileInfo" class="text-muted" style="margin-bottom: 8px;">{{.logFilePath}}</div>

        <div id="logConsole"
             style="background:#1b1f23;color:#c5c8c6;height:650px;overflow-y:auto;overflow-x:auto;
                    font-family:Menlo,Consolas,monospace;font-size:12px;line-height:18px;padding:10px;
                    border-radius:3px;white-space:pre-wrap;word-break:break-all;">
        </div>

        <!-- 确认文案容器：仅供 JS 读取文本用于 confirm 弹窗，不能在页面上直接显示。
             Bootstrap 4 没有全局 .hide 规则（只有 .toast.hide），必须用 .d-none 隐藏。 -->
        <span id="logClearConfirm" class="d-none" langtag="info-logcleartips"></span>
    </div>
</div>

<script>
    var logPaused = false;
    var logTimer = null;
    var logFiles = [];

    function logEscape(text) {
        return String(text == null ? '' : text)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    // beego 的日志行格式：2026/11/05 14:48:50.666 [I] [file.go:123]  message
    function logLevelOf(line) {
        var m = line.match(/^\S+ \S+ \[[A-Z]\]/);
        if (!m) return '';
        var flags = { 'E': 'error', 'W': 'warning', 'N': 'notice', 'I': 'info', 'D': 'debug' };
        return flags[m[0].charAt(m[0].length - 2)] || '';
    }

    function logLevelColor(level) {
        switch (level) {
            case 'error': return '#f97583';
            case 'warning': return '#e2c08d';
            case 'notice': return '#7ee787';
            case 'debug': return '#8b949e';
            default: return '#c5c8c6';
        }
    }

    function logRender() {
        var keyword = ($('#logKeyword').val() || '').toLowerCase();
        var level = $('#logLevel').val();
        var html = '';
        var shown = 0;
        var total = 0;
        for (var f = 0; f < logFiles.length; f++) {
            var file = logFiles[f];
            var fileHtml = '';
            var fileShown = 0;
            for (var i = 0; i < file.lines.length; i++) {
                var line = file.lines[i];
                total++;
                var lv = logLevelOf(line);
                if (level && lv !== level) continue;
                if (keyword && line.toLowerCase().indexOf(keyword) < 0) continue;
                fileShown++;
                fileHtml += '<div><span style="color:' + logLevelColor(lv) + '">'
                    + logEscape(line) + '</span></div>';
            }
            if (fileShown === 0) continue;
            shown += fileShown;
            html += '<div style="margin:6px 0 2px;color:#79c0ff;font-weight:bold;">=== '
                + logEscape(file.name) + ' (' + file.size + ' bytes) ===</div>' + fileHtml;
        }
        if (html === '') {
            html = '<div style="color:#8b949e">(no log)</div>';
        }
        var box = document.getElementById('logConsole');
        var atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
        var oldTop = box.scrollTop;
        box.innerHTML = html;
        if (atBottom) {
            box.scrollTop = box.scrollHeight;
        } else {
            box.scrollTop = oldTop;
        }
        $('#logStat').text(total + ' 行'
            + (keyword || level ? ' (过滤后 ' + shown + ' 行)' : '')
            + ' / ' + logFiles.length + ' 个文件');
    }

    function logFetch() {
        if (logPaused) return;
        $.ajax({
            type: 'GET',
            url: '{{.web_base_url}}/log/list',
            data: { lines: 1000 },
            dataType: 'json',
            success: function (res) {
                if (!res || res.status !== 1) return;
                logFiles = res.files || [];
                logRender();
            }
        });
    }

    $(function () {
        logFetch();
        logTimer = setInterval(logFetch, 30000);

        $('#logKeyword, #logLevel').on('input change', function () {
            logRender();
        });
        $('#logRefresh').on('click', function () {
            logFetch();
        });
        $('#logToggle').on('click', function () {
            logPaused = !logPaused;
            $('#logToggleText').attr('langtag', logPaused ? 'word-logrun' : 'word-logpause');
            $('#logToggle').find('i').attr('class', logPaused ? 'fa fa-play' : 'fa fa-pause');
            $('body').setLang('');
        });
        $('#logDownload').on('click', function () {
            var text = '';
            for (var f = 0; f < logFiles.length; f++) {
                text += '=== ' + logFiles[f].name + ' ===\n' + logFiles[f].lines.join('\n') + '\n\n';
            }
            var blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            var a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'nps-log-' + new Date().toISOString().replace(/[:.]/g, '-') + '.txt';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        });
        $('#logClear').on('click', function () {
            var tip = $('#logClearConfirm').text() || 'Clear the logs?';
            if (!confirm(tip)) return;
            var $btn = $(this).prop('disabled', true);
            $.ajax({
                type: 'POST',
                url: '{{.web_base_url}}/log/clear',
                success: function (res) {
                    if (res && res.status === 1) {
                        logFiles = [];
                        logRender();
                        // 清理完成后同步重启服务：Linux 上删除当前日志文件后
                        // beego 仍持有旧 inode 句柄，重启后才会重新生成日志文件
                        restartAfterClear();
                    } else {
                        $btn.prop('disabled', false);
                    }
                },
                error: function () {
                    $btn.prop('disabled', false);
                }
            });
        });
    });

    // 清理日志后重启服务：POST /global/restart -> 轮询 /global/restartpid
    // 直到 PID 变化（新进程接管）再刷新页面，逻辑与全局参数页的重启按钮一致
    function restartAfterClear() {
        $.ajax({
            type: 'POST',
            url: '{{.web_base_url}}/global/restart',
            data: {},
            success: function (res) {
                if (res && res.status) {
                    var oldPid = String(res.id);
                    setTimeout(function () { pollRestartAfterClear(oldPid, 0); }, 3000);
                } else {
                    // 重启指令被拒（理论上日志页仅管理员可达，不应出现），只刷新页面
                    location.reload();
                }
            },
            error: function () {
                // 请求被掐断说明进程正在退出，同样进入轮询
                setTimeout(function () { pollRestartAfterClear('-1', 0); }, 3000);
            }
        });
    }

    function pollRestartAfterClear(oldPid, tries) {
        // 最长轮询 2 分钟（60 次 x 2s），超时直接刷新页面交给用户判断
        if (tries >= 60) {
            location.reload();
            return;
        }
        $.ajax({
            type: 'GET',
            url: '{{.web_base_url}}/global/restartpid?_t=' + Date.now(),
            dataType: 'text',
            cache: false,
            success: function (text) {
                // PID 变化，或响应不再是纯数字（会话失效跳转登录页）都说明已切换进程
                if ($.trim(text) !== oldPid || !/^\d+$/.test($.trim(text))) {
                    location.reload();
                } else {
                    setTimeout(function () { pollRestartAfterClear(oldPid, tries + 1); }, 2000);
                }
            },
            error: function () {
                setTimeout(function () { pollRestartAfterClear(oldPid, tries + 1); }, 2000);
            }
        });
    }
</script>
