<!DOCTYPE html>
<html>

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title langtag="title-register"></title>

    <!-- 主题：在样式加载前应用，避免暗色模式首屏白闪 -->
    <script>
        (function () {
            try {
                var t = window.localStorage.getItem('nps_theme');
                if (t !== 'light' && t !== 'dark') {
                    // 首次访问：跟随操作系统的深色偏好，并把结果固化下来
                    t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
                    window.localStorage.setItem('nps_theme', t);
                }
                if (t === 'dark') {
                    document.documentElement.classList.add('dark-theme');
                }
            } catch (e) {
            }
        })();
    </script>

    <!-- Mainly scripts -->
    <!-- Latest compiled and minified CSS -->
    <link href="{{.web_base_url}}/static/css/fontawesome.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/solid.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/bootstrap.min.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/style.css?v={{.version}}" rel="stylesheet">
    <link href="{{.web_base_url}}/static/css/dark.css?v={{.version}}" rel="stylesheet">

    <!-- Latest compiled and minified JavaScript -->
    <script src="{{.web_base_url}}/static/js/jquery-3.4.1.min.js?v={{.version}}"></script>
    <script src="{{.web_base_url}}/static/js/bootstrap.min.js?v={{.version}}"></script>
    <!-- Latest compiled and minified Locales -->
    <script src="{{.web_base_url}}/static/js/language.js?v={{.version}}" type="text/javascript"></script>
    <script src="{{.web_base_url}}/static/js/theme.js?v={{.version}}" type="text/javascript"></script>

</head>

<body class="gray-bg">
    <div class="row border-bottom">
        <nav class="navbar navbar-static-top navbar-right" role="navigation" style="margin: 20px 40px">
            <div></div>
            <span class="btn-group dropdown">
                <button id="languagemenu" class="btn btn-primary dropdown-toggle" type="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false"><i class="fa fa-globe-asia fa-lg"></i><span></span></button>
                <ul class="dropdown-menu"></ul>
            </span>
            <button id="themeToggle" class="btn btn-primary" type="button">
                <i class="fa fa-sun"></i>
                <span class="theme-label d-none" langtag="word-themeswitch"></span>
            </button>
        </nav>
    </div>
    <div class="middle-box text-center loginscreen   animated fadeInDown">
        <div>
            <h1 class="logo-name" langtag="application"></h1>
        </div>
        <h3 langtag="info-register"></h3>
        <p langtag="info-createaccount"></p>
        <form class="m-t" role="form" onsubmit="return false">
            <div class="form-group">
                <input type="text" class="form-control" placeholder="username" name="username" required="" langtag="word-username">
            </div>
            <div class="form-group">
                <input type="password" class="form-control" placeholder="password" name="password" required="" langtag="word-password">
            </div>
            <button onclick="register()" type="submit" class="btn btn-primary block full-width m-b" langtag="word-register"></button>
            <p class="text-muted text-center"><small langtag="info-haveaccount"></small></p>
            <a class="btn btn-sm btn-white btn-block" href="{{.web_base_url}}/login/index" langtag="word-login"></a>
        </form>
    </div>
    <hr/>
    <div class="footer">
        <div class="pull-right">
            <span langtag="word-readmore"></span> <strong><a href="https://ehang.io/nps" langtag="word-go"></a></strong>
        </div>
        <div><strong langtag="word-copyright"></strong> <span langtag="application"></span> &copy; 2018-2019</div>
    </div>
<script>
    window.nps = { "web_base_url": {{.web_base_url}}, "version": "{{.version}}" }
    function register() {
        $.ajax({
            type: "POST",
            url: "{{.web_base_url}}/login/register",
            data: $("form").serializeArray(),
            success: function (res) {
                alert(res.msg)
                if (res.status) {
                    window.location.href = "{{.web_base_url}}/login/index"
                }
            }
        })
        return false
    }
</script>
</body>

</html>
