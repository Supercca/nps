<style>
    .global-param-page .global-hero {
        background: linear-gradient(135deg, #1ab394 0%, #18a689 55%, #12876f 100%);
        border-radius: 6px;
        color: #fff;
        padding: 12px 20px;
        margin-bottom: 16px;
        box-shadow: 0 4px 12px rgba(26, 179, 148, .18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
    }
    .global-param-page .global-hero .hero-text {
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
        min-width: 0;
    }
    .global-param-page .global-hero h2 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        color: #fff;
    }
    .global-param-page .global-hero p {
        margin: 0;
        opacity: .85;
        font-size: 12px;
    }
    .global-param-page .global-hero .btn-save {
        background: #fff;
        border-color: #fff;
        color: #12876f;
        font-weight: 600;
        font-size: 13px;
        padding: 6px 20px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, .12);
        flex: 0 0 auto;
    }
    .global-param-page .global-hero .btn-save:hover,
    .global-param-page .global-hero .btn-save:focus {
        background: #f1fbf7;
        border-color: #f1fbf7;
        color: #0f7460;
    }
    .global-param-page .setting-card {
        background: #fff;
        border: 1px solid #e7eaec;
        border-radius: 6px;
        margin-bottom: 20px;
        box-shadow: 0 1px 3px rgba(0, 0, 0, .04);
        overflow: hidden;
    }
    .global-param-page .setting-card-head {
        padding: 14px 20px;
        border-bottom: 1px solid #f0f2f5;
        font-size: 15px;
        font-weight: 600;
        color: #2f4050;
        background: #fbfcfd;
    }
    .global-param-page .setting-card-head i {
        color: #1ab394;
        margin-right: 8px;
        width: 18px;
        text-align: center;
    }
    .global-param-page .setting-card-body {
        padding: 8px 20px 18px;
    }
    .global-param-page .setting-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 18px;
        padding: 15px 0;
        border-bottom: 1px dashed #eef1f4;
    }
    .global-param-page .setting-row:last-child {
        border-bottom: none;
        padding-bottom: 4px;
    }
    .global-param-page .setting-title {
        font-weight: 600;
        color: #2f4050;
        margin-bottom: 4px;
        line-height: 1.4;
    }
    .global-param-page .setting-desc {
        color: #98a6ad;
        font-size: 12px;
        line-height: 1.6;
        max-width: 460px;
    }
    .global-param-page .setting-control {
        flex: 0 0 auto;
        padding-top: 2px;
    }
    .global-param-page .setting-field {
        padding: 15px 0;
        border-bottom: 1px dashed #eef1f4;
    }
    .global-param-page .setting-field:last-child {
        border-bottom: none;
    }
    .global-param-page .setting-field > label {
        font-weight: 600;
        color: #2f4050;
        margin-bottom: 8px;
        display: block;
    }
    .global-param-page .setting-field .help-block {
        margin-top: 6px;
        color: #98a6ad;
        font-size: 12px;
    }
    @media (max-width: 767px) {
        .global-param-page .setting-row {
            flex-direction: column;
            gap: 10px;
        }
        .global-param-page .setting-desc {
            max-width: none;
        }
        .global-param-page .global-hero .hero-text {
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
        }
        .global-param-page .global-hero .btn-save {
            width: 100%;
        }
    }
</style>

<div class="wrapper wrapper-content global-param-page">
    <form class="form-horizontal" id="globalParamForm">
        <div class="row">
            <div class="col-lg-12">
                <div class="global-hero">
                    <div class="hero-text">
                        <h2 langtag="word-globalparam"></h2>
                        <p langtag="info-globalparamsdesc"></p>
                    </div>
                    <button class="btn btn-save" type="button"
                            onclick="submitform('global', '{{.web_base_url}}/global/save', $('form').serializeArray())">
                        <i class="fa fa-fw fa-check-circle"></i> <span langtag="word-save"></span>
                    </button>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-lg-6">
                <div class="setting-card">

                            <input class="form-control" value="{{.serverUrl}}" type="text" name="serverUrl"
                                   placeholder="" langtag="info-servertips">
                            <span class="help-block m-b-none" langtag="info-servertips"></span>
                        </div>

                        <div class="setting-field" id="allow_ports">
                            <label langtag="word-allowports"></label>

                            <span class="help-block m-b-none" langtag="info-allowportstips"></span>
                        </div>

                                <div class="setting-title" langtag="word-showhttpport"></div>
                                <div class="setting-desc" langtag="info-showhttptips"></div>
                            </div>

                                <div class="onoffswitch">
                                    <input type="checkbox" name="showHttpProxyPort" value="1" class="onoffswitch-checkbox"
                                           id="showHttpProxyPort" {{if .showHttpProxyPort}}checked{{end}}>
                                    <label class="onoffswitch-label" for="showHttpProxyPort">
                                        <span class="onoffswitch-inner"></span>
                                        <span class="onoffswitch-switch"></span>
                                    </label>
                                </div>

                        </div>

                                           id="ipLimit" {{if .ipLimit}}checked{{end}}>

                                        <span class="onoffswitch-inner"></span>
                                        <span class="onoffswitch-switch"></span>
                                    </label>
                                </div>
                            </div>

                                </div>
                            </div>

                                </button>

                            <div class="setting-control">
                                <div class="onoffswitch">
                                    <input type="checkbox" name="autoRestartEnabled" value="1"
                                           class="onoffswitch-checkbox" id="autoRestartEnabled"
                                           {{if .autoRestartEnabled}}checked{{end}}>
                                    <label class="onoffswitch-label" for="autoRestartEnabled">
                                        <span class="onoffswitch-inner"></span>
                                        <span class="onoffswitch-switch"></span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="setting-field" id="auto_restart_time">
                            <label langtag="word-autorestarttime"></label>
                            <input class="form-control" value="{{.autoRestartTime}}" type="text"
                                   name="autoRestartTime" placeholder="04:00" maxlength="5">
                            <span class="help-block m-b-none" langtag="info-autorestarttimetimeps"></span>
                        </div>

                        <div class="setting-field" id="auto_restart_weekdays">
                            <label langtag="word-autorestartweekdays"></label>
                            <div class="row">
                                {{range .autoRestartWeekdays}}
                                <div class="col-sm-3">
                                    <div class="checkbox">
                                        <label>
                                            <input type="checkbox" name="autoRestartWeekdays" value="{{.Value}}"
                                                   {{if .Checked}}checked{{end}}>
                                            <span langtag="{{.Name}}"></span>
                                        </label>
                                    </div>
                                </div>
                                {{end}}
                            </div>
                            <span class="help-block m-b-none" langtag="info-autorestartweekdaystips"></span>
                        </div>

                        <div class="setting-field" id="data_backup">
                            <label langtag="word-backupdata"></label>
                            <div class="row">
                                <div class="col-sm-6">
                                    <button class="btn btn-primary" type="button" id="btnDownloadBackup"
                                            onclick="downloadBackup()">
                                        <i class="fa fa-fw fa-download"></i> <span langtag="word-downloadbackup"></span>
                                    </button>
                                </div>
                            </div>
                            <div class="row" style="margin-top: 10px;">
                                <div class="col-sm-8">
                                    <input type="file" id="backupFile" accept=".zip,application/zip"
                                           class="form-control" placeholder="&nbsp;">
                                </div>
                                <div class="col-sm-4">
                                    <button class="btn btn-danger" type="button" id="btnRestoreBackup"
                                            onclick="restoreBackup(this)">
                                        <i class="fa fa-fw fa-upload"></i> <span langtag="word-restorebackup"></span>
                                    </button>
                                </div>
                            </div>
                            <span class="help-block m-b-none" langtag="info-backupdatatips"></span>
                            <span class="help-block m-b-none" langtag="info-restoretips"></span>
                        </div>
                    </div>
                </div>
                {{end}}
            </div>

            <div class="col-lg-6">

                            <div class="setting-control">

                                {{range .menuOptions}}
                                <div class="col-sm-4">

                                        <label>
                                            <input type="checkbox" name="hiddenMenus" value="{{.Key}}"
                                                   {{if .Checked}}checked{{end}} {{if eq .Key "global"}}disabled{{end}}>
                                            <span langtag="{{.Name}}"></span>
                                        </label>
                                    </div>
                                </div>
                                {{end}}
                            </div>
                            <span class="help-block m-b-none" langtag="info-hiddenmenustips"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>

<script>
    // 重启服务：确认 -> POST /global/restart -> 轮询 /global/restartpid
    // 直到 PID 变化（说明新进程已接管）再刷新页面，避免把还没退出的旧进程误判为已恢复
    function restartService(btn) {
        var confirmObj = (languages && languages['content'] && languages['content']['confirm']) ? languages['content']['confirm']['restart'] : null;
        var confirmMsg = (confirmObj && (confirmObj[languages['current']] || confirmObj[languages['default']])) || 'Are you sure you want to restart the service?';
        if (!confirm(confirmMsg)) return;
        var $btn = $(btn).prop('disabled', true);
        $.ajax({
            type: 'POST',
            url: window.nps.web_base_url + '/global/restart',
            data: {},
            success: function (res) {
                if (res.status) {
                    var oldPid = String(res.id);
                    // 延迟 3 秒再开始轮询，给旧进程留出退出窗口
                    setTimeout(function () { pollRestart(oldPid, 0); }, 3000);
                } else {
                    alert(langreply(res.msg));
                    $btn.prop('disabled', false);
                }
            },
            error: function () {
                // 请求被掐断说明进程正在退出，同样进入轮询
                setTimeout(function () { pollRestart('-1', 0); }, 3000);
            }
        });
    }

    // 读取主词条文本（languages.xml 里 <lang id="..."> 的当前语言值）
    function langText(id) {
        var obj = (languages && languages['content']) ? languages['content'][id] : null;
        if (!obj) return id;
        if (typeof obj === 'string') return obj;
        return obj[languages['current']] || obj[languages['default']] || id;
    }

    // 下载备份：直接让浏览器访问下载接口，服务端返回 zip 附件
    function downloadBackup() {
        window.location.href = window.nps.web_base_url + '/global/backup';
    }

    // 恢复备份：上传 zip 包 -> POST /global/restore
    function restoreBackup(btn) {
        var input = document.getElementById('backupFile');
        if (!input || !input.files || input.files.length === 0) {
            alert(langreply('selectbackupfile'));
            return;
        }
        var f = input.files[0];
        if (f.size > 32 * 1024 * 1024) {
            alert(langreply('backupfiletoolarge'));
            return;
        }
        var confirmObj = (languages && languages['content'] && languages['content']['confirm']) ? languages['content']['confirm']['restore'] : null;
        var confirmMsg = (confirmObj && (confirmObj[languages['current']] || confirmObj[languages['default']])) || 'Overwrite the current data with this backup?';
        if (!confirm(confirmMsg)) return;

        var fd = new FormData();
        fd.append('file', f);
        var $btn = $(btn).prop('disabled', true);
        $.ajax({
            type: 'POST',
            url: window.nps.web_base_url + '/global/restore',
            data: fd,
            processData: false,
            contentType: false,
            success: function (res) {
                $btn.prop('disabled', false);
                if (res && res.status) {
                    alert(langreply('restoresuccess') + '\n' + langText('word-restartneeded'));
                } else {
                    alert((res && res.detail) ? res.detail : langreply('restorefailed'));
                }
            },
            error: function () {
                $btn.prop('disabled', false);
                alert(langreply('restorefailed'));
            }
        });
    }

    function pollRestart(oldPid, tries) {
        // 最长轮询 2 分钟（60 次 x 2s），超时直接刷新页面交给用户判断
        if (tries >= 60) {
            location.reload();
            return;
        }
        $.ajax({
            type: 'GET',
            url: window.nps.web_base_url + '/global/restartpid?_t=' + Date.now(),
            dataType: 'text',
            cache: false,
            success: function (text) {
                // PID 变化，或响应不再是纯数字（会话失效跳转登录页）都说明已切换进程
                if ($.trim(text) !== oldPid || !/^\d+$/.test($.trim(text))) {
                    location.reload();
                } else {
                    setTimeout(function () { pollRestart(oldPid, tries + 1); }, 2000);
                }
            },
            error: function () {
                setTimeout(function () { pollRestart(oldPid, tries + 1); }, 2000);
            }
        });
    }
</script>
